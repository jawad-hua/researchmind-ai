[project]
name = "researchmind-ai"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "groq==0.11.0",
    "httpx==0.27.2",
    "tavily-python==0.5.0",
    "python-dotenv==1.0.1",
    "chromadb>=1.0.0",
    "pypdf>=5.0.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9"
]

[tool.setuptools]
py-modules = []

[tool.fastapi]
entrypoint = "backend.main:app"