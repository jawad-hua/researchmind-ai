name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Dummy keys — the test suite mocks every LLM/search call and
          # never makes a real network request, but the modules read
          # these env vars at import time so they must be set to *something*.
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
        run: pytest -v
